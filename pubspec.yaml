name: creator_360
description: A Flutter app for 360 Creator agency to showcase video work and manage client inquiries.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase backend
  supabase_flutter: ^2.3.0

  # State management
  mobx: ^2.3.0
  flutter_mobx: ^2.2.0

  # Navigation
  go_router: ^13.0.0

  # Dependency injection
  provider: ^6.1.2

  # Data
  equatable: ^2.0.5

  # Email
  mailer: ^6.1.0

  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  video_player: ^2.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  mobx_codegen: ^2.6.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
