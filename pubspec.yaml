name: creator_360
description: Social media marketing agency app for video creation, editing, and client bookings.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ==================== STATE MANAGEMENT ====================
  mobx: ^2.3.0
  flutter_mobx: ^2.0.0

  # ==================== BACKEND & DATABASE ====================
  supabase_flutter: ^2.0.0
  supabase: ^2.0.0

  # ==================== HTTP & NETWORKING ====================
  http: ^1.1.0
  dio: ^5.3.0

  # ==================== VIDEO PLAYER ====================
  video_player: ^2.8.0
  chewie: ^1.8.0

  # ==================== IMAGE & MEDIA ====================
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0

  # ==================== FORMS & VALIDATION ====================
  formz: ^0.6.0

  # ==================== DEPENDENCY INJECTION ====================
  get_it: ^7.6.0

  # ==================== NOTIFICATIONS & EMAIL ====================
  mailer: ^6.1.0

  # ==================== UI & COMPONENTS ====================
  flutter_widget_from_html: ^0.0.20
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_svg: ^2.0.0

  # ==================== NAVIGATION ====================
  go_router: ^13.0.0

  # ==================== UTILITIES ====================
  intl: ^0.19.0
  connectivity_plus: ^5.0.0
  logger: ^2.0.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  equatable: ^2.0.5

  # ==================== RESPONSIVE DESIGN ====================
  responsive_builder: ^0.7.0

  # ==================== ANALYTICS ====================
  firebase_core: ^2.24.0
  firebase_analytics: ^10.6.0

  # ==================== STATE & PROVIDER ====================
  provider: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ==================== CODE GENERATION ====================
  build_runner: ^2.4.0
  mobx_codegen: ^2.2.0

  # ==================== LINTING ====================
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
