name: creator_360
description: 360 Creator - Social Media Marketing Agency Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  mobx: ^2.3.0
  flutter_mobx: ^2.2.0

  # Backend
  supabase_flutter: ^2.5.0

  # HTTP & Networking
  http: ^1.2.0

  # Video Player
  video_player: ^2.8.0

  # Image & Media
  cached_network_image: ^3.3.0

  # UI Components
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0

  # Navigation
  go_router: ^13.2.0

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^6.0.0
  logger: ^2.2.0
  equatable: ^2.0.5
  uuid: ^4.3.3
  url_launcher: ^6.2.5

  # Responsive Design
  responsive_builder: ^0.7.0

  # Icons
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # MobX Code Generator
  build_runner: ^2.4.9
  mobx_codegen: ^2.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
